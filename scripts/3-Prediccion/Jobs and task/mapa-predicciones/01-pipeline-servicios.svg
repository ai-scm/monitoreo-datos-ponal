<text x="40" y="108" class="title">Pipeline de predicciones · servicios y datos</text>
<text x="40" y="143" class="sub">Núcleo confirmado por el PDF: timeFrame=TURNO vía POST /pred/completo. Los nombres AWS se cruzan con el inventario.</text>
