<text x="59" y="586" class="body">y fechas de entrenamiento</text>
<text x="59" y="611" class="body">Lectura SQL → CSV</text>
<rect x="440" y="500" width="390" height="145" rx="14" fill="#edf0fb" stroke="#7181b8" stroke-width="2" />
