<text x="459" y="561" class="body">pon-prod-prediccion-demanda-{cad}</text>
<text x="459" y="586" class="body">SER: procesando → tarea: final/error</text>
<text x="459" y="611" class="body">Índice: fecha_unidad_global_index</text>
<rect x="980" y="500" width="540" height="145" rx="14" fill="#edf0fb" stroke="#7181b8" stroke-width="2" />
<text x="999" y="532" class="node-title">S3 · pon-prod-ml-iapol</text>
<text x="999" y="561" class="body">Lee: UnidadesBase/{CAD}-UnidadesBase.geojson</text>
<text x="999" y="586" class="body">Escribe: PrediccionMdP/ → GeoJSON + PKL</text>
<text x="999" y="611" class="body">Prediccion_* y PuntosApoyo_*</text>
