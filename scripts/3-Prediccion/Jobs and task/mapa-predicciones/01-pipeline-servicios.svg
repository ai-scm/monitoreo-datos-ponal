<text x="459" y="281" class="body">pon-xcrimePredictionDemanda-</text>
<text x="459" y="306" class="body">services · puerto 8080</text>
<text x="459" y="331" class="body">Candidato: pred-demanda-ser</text>
<rect x="980" y="220" width="540" height="150" rx="14" fill="#e6f3f5" stroke="#178593" stroke-width="2" />
