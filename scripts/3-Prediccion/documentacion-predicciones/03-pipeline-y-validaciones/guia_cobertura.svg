<title id="title">Guía de scripts y alcance del diagrama</title><desc id="desc">Versión 30 de octubre de 2026: nueve scripts habituales y un diagnóstico opcional; 100% del alcance funcional aceptado. Automatización y alertas pertenecen a la implementación posterior. Lectura de probabilidaddelito confirmada en la tarea de predicción DECAU.</desc>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#526880" /></marker></defs>
